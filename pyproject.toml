[project]
name = "dactopus"
version = "0.0.0"
description = "Runner of Dactopus: loads sources into ClickHouse, builds the canonical tables, runs checks, serves the models over MCP"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Alex Kosachev" }]
requires-python = ">=3.11"
keywords = ["clickhouse", "ecommerce", "ga4", "shopify", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
# Dependencies arrive with the code that needs them.
dependencies = [
    "certifi>=2024.2",
    "clickhouse-connect[arrow]>=0.8",
    "dbt-clickhouse~=1.10.0",
    "dbt-core~=1.11.0",
    # Not on PyPI yet: its own apache-ossie dependency is a git reference.
    "dactopus-ossie-clickhouse[mcp] @ git+https://github.com/Dactopus/dactopus-ossie-clickhouse@v0.10.0",
    "google-auth>=2.30",
    "google-cloud-bigquery-storage[pyarrow]>=2.27",
    "pyyaml>=6",
    "tzdata>=2026.5",
]

[project.urls]
Homepage = "https://github.com/Dactopus/dactopus"
Issues = "https://github.com/Dactopus/dactopus/issues"

[project.scripts]
dactopus = "dactopus.cli:main"

# Checks: the entry point's name is the check's name. A plugin registers
# its own in the same group.
[project.entry-points."dactopus.checks"]
dbt = "dactopus.checks:dbt_results"
freshness = "dactopus.checks:freshness"
rows_per_day = "dactopus.checks:rows_per_day"
time_zone = "dactopus.checks:time_zone"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/dactopus"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a reachable ClickHouse (skipped otherwise)"]
