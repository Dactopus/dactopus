# What a deployment of this union sets and reads. A tool that deploys
# it reads this file; it does not read the project's SQL. Format and
# checks: tests/check_deployment.py.
model: entities/web_analytics.yaml
# A role, and the dbt variable (dbt_project.yml) that plays it: the
# databases of the properties, each with a deployment of its package. Rows
# are counted per day in those databases, by each package's deployment.yml.
vars:
  input_databases: web_analytics_union_databases
