# What a deployment of this package sets and reads. A tool that deploys
# the package reads this file; it does not read the package's SQL.
# Format and checks: tests/check_deployment.py.
model: entities/commerce.yaml
# A role, and the dbt variable (dbt_project.yml) that plays it.
vars:
  input_database: woocommerce_input_database
  source_id: woocommerce_source_id
  time_zone: woocommerce_timezone
# The built tables a deployment counts rows per day in, by `date`, a Date
# column. `time` is the column whose day `date` is, in the zone of
# woocommerce_timezone (order_time is the time the reports date the order
# by, woocommerce_date_type). orders and refunds are incremental: a run
# after the zone changed stops (macros/settings.sql), and a
# --full-refresh builds them in the new one; a row where `date` is not
# the day of `time` in the zone is one built in another. `gap: true`: a
# day without rows is a finding there.
daily:
  - {table: orders, date: order_date, time: order_time, gap: true}
  - {table: refunds, date: refund_date, time: refund_time}
